<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功 - 爆猫加速器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary-color: #7e34f5;
            --secondary-color: #3cc0f0;
            --text-color: #333;
            --light-text: #7a7a7a;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --success-green: #2ecc71;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            padding: 1rem;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            padding: 1rem;
            text-align: center;
        }
        
        .success-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transform: translateY(50px);
            opacity: 0;
            animation: slideUp 0.8s ease forwards;
        }
        
        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(126, 52, 245, 0.3);
        }
        
        .success-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            transform: translateY(-50%);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% {
                transform: translateY(-100%);
            }
            50% {
                transform: translateY(100%);
            }
            100% {
                transform: translateY(100%);
            }
        }
        
        .checkmark {
            width: 40%;
            height: 40%;
            border-radius: 50%;
            display: block;
            stroke-width: 5;
            stroke: #fff;
            stroke-miterlimit: 10;
            box-shadow: inset 0 0 0 var(--success-green);
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
            position: relative;
            z-index: 1;
        }
        
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 5;
            stroke-miterlimit: 10;
            stroke: #fff;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        
        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }
        
        @keyframes scale {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
        }
        
        @keyframes fill {
            100% {
                box-shadow: inset 0 0 0 30px transparent;
            }
        }
        
        .success-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: fadeIn 1s ease 0.5s forwards;
            opacity: 0;
        }
        
        .message {
            margin-top: 2rem;
            line-height: 1.8;
            color: var(--light-text);
            animation: fadeIn 1s ease 0.7s forwards;
            opacity: 0;
        }
        
        .message p {
            margin-bottom: 0.7rem;
        }
        
        .message p:last-child {
            margin-top: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: rgba(126, 52, 245, 0.4);
            opacity: 0;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            70% {
                transform: scale(1.5);
                opacity: 0;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }
            
            .container {
                padding: 0.5rem;
            }
            
            .success-card {
                padding: 2rem 1.5rem;
            }
            
            .success-icon {
                width: 80px;
                height: 80px;
            }
            
            .success-title {
                font-size: 2rem;
            }
            
            .message {
                font-size: 0.95rem;
            }
        }
        
        @media (max-width: 480px) {
            .success-card {
                padding: 1.8rem 1.2rem;
            }
            
            .success-icon {
                width: 70px;
                height: 70px;
                margin-bottom: 1.2rem;
            }
            
            .success-title {
                font-size: 1.8rem;
            }
            
            .message {
                margin-top: 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-card">
            <div class="success-icon">
                <div class="pulse"></div>
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            
            <h1 class="success-title">支付成功</h1>
            
            <div class="message">
                <p>您的订单已支付完成。</p>
                <p>如果对订单有问题 请及时加入售后群</p>
                <p>APP用户请回到APP查看订单</p>
                <p>感谢您的购买与使用！</p>
            </div>
        </div>
    </div>
</body>
</html>
